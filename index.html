<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D4E89">
<title>Quiz · População · Geografia 8.º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
<style>
:root{
  --bg:#F3F7FC; --card:#FFFFFF; --ink:#16202B; --muted:#4A5866; --line:#D5DFEA;
  --blue:#1D4E89; --on-blue:#FFFFFF; --blue-soft:#E3ECF7;
  --orange:#C2410C; --orange-soft:#FCE9DC;
  --ok:#1F7A4A; --ok-soft:#E2F3E9; --bad:#B42318; --bad-soft:#FBE7E5;
  --men:#2F6DB5; --women:#D9625C;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1620; --card:#18222E; --ink:#EAF0F6; --muted:#A9B6C4; --line:#2E3C4B;
    --blue:#8DB8EC; --on-blue:#0F1620; --blue-soft:#1C2E44;
    --orange:#F2A06B; --orange-soft:#3A2618;
    --ok:#6FD39C; --ok-soft:#143325; --bad:#FF8A80; --bad-soft:#3A1A18;
    --men:#6FA3E0; --women:#EE8A84;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  font-size:18px; line-height:1.45;
  padding: env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
}
button, select{font:inherit; color:inherit}
button{cursor:pointer; -webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--orange); outline-offset:2px}
.wrap{max-width:560px; margin:0 auto; padding:0 16px 40px}

/* barra de progresso: rota de voo */
.bar{position:sticky; top:0; z-index:5; background:var(--bg); padding:12px 0 10px; border-bottom:1px solid var(--line); margin-bottom:18px}
.bar-row{display:flex; justify-content:space-between; align-items:center; font-weight:800; font-size:15px; color:var(--muted); margin-bottom:10px}
.bar-row strong{color:var(--ink)}
.quit{background:none; border:0; padding:6px 0; font-weight:800; font-size:15px; color:var(--blue)}
.route{position:relative; height:22px}
.route::before{content:""; position:absolute; left:0; right:0; top:10px; border-top:3px dashed var(--line)}
.route .done{position:absolute; left:0; top:10px; border-top:3px solid var(--blue); width:0; transition:width .35s ease}
.route .plane{position:absolute; top:0; width:22px; height:22px; margin-left:-11px; color:var(--blue); transition:left .35s ease}

/* início */
.hero{padding:28px 0 8px}
.hero h1{font-size:34px; line-height:1.1; margin:6px 0 10px; font-weight:900; letter-spacing:-0.01em}
.hero p{margin:0; color:var(--muted); font-weight:600}
.kicker{font-weight:800; color:var(--blue); font-size:16px}
.modes{display:grid; gap:12px; margin:24px 0}
.mode{display:flex; flex-direction:column; align-items:flex-start; gap:2px; width:100%; text-align:left; border:2px solid var(--line); background:var(--card); border-radius:16px; padding:16px 18px}
.mode b{font-size:20px; font-weight:900}
.mode span{color:var(--muted); font-weight:600; font-size:16px}
.mode.main{background:var(--blue); border-color:var(--blue); color:var(--on-blue)}
.mode.main span{color:var(--on-blue); opacity:.9}
.mode:active{transform:scale(.99)}
.themes h2{font-size:18px; font-weight:900; margin:8px 0 10px}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.tchip{border:2px solid var(--line); background:var(--card); border-radius:999px; padding:9px 14px; font-weight:800; font-size:16px}
.note{margin-top:22px; padding:14px 16px; border-radius:14px; background:var(--blue-soft); font-weight:600; font-size:16px}
.best{margin-top:10px; font-weight:800; color:var(--ok); font-size:16px}

/* pergunta */
.tag{display:inline-block; font-size:14px; font-weight:800; color:var(--blue); background:var(--blue-soft); border-radius:999px; padding:4px 12px; margin-bottom:10px}
.q{font-size:22px; line-height:1.35; font-weight:800; margin:0 0 14px}
.block{background:var(--card); border:2px solid var(--line); border-left:6px solid var(--blue); border-radius:12px; padding:12px 14px; margin:0 0 16px; font-size:17px; font-weight:600}
.block p{margin:0 0 6px} .block p:last-child{margin:0}
table.data{border-collapse:collapse; width:100%; font-size:16px}
table.data th, table.data td{padding:7px 8px; text-align:left; border-bottom:1px solid var(--line)}
table.data th{font-size:14px; color:var(--muted); font-weight:800}
table.data td{font-weight:700; font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.pyr{background:var(--card); border:2px solid var(--line); border-radius:12px; padding:12px 14px 8px; margin:0 0 16px}
.pyr-legend{display:flex; justify-content:space-between; font-weight:800; font-size:15px; margin-bottom:6px}
.pyr-legend .m{color:var(--men)} .pyr-legend .f{color:var(--women)}
.pyr svg{display:block; width:100%; max-width:300px; margin:0 auto; height:auto}
.pyr small{display:block; text-align:center; color:var(--muted); font-weight:600; font-size:14px; margin-top:6px}

.opts{display:grid; gap:10px}
.opt{display:flex; align-items:center; gap:12px; width:100%; min-height:58px; text-align:left; padding:12px 14px; border:2px solid var(--line); border-radius:14px; background:var(--card); font-size:18px; font-weight:700; line-height:1.3}
.opt .k{flex:0 0 32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:var(--blue-soft); color:var(--blue); font-weight:900; font-size:16px}
.opt.right{border-color:var(--ok); background:var(--ok-soft)}
.opt.right .k{background:var(--ok); color:var(--card)}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad); color:var(--card)}
.opt[disabled]{cursor:default}
.opt:not([disabled]):active{transform:scale(.99)}

/* blocos */
.hint{font-size:16px; color:var(--muted); font-weight:700; margin:0 0 8px}
.slots{display:flex; flex-wrap:wrap; align-items:center; gap:8px; min-height:66px; padding:10px; border:2px dashed var(--line); border-radius:14px; background:var(--card); margin-bottom:14px}
.slots .empty{color:var(--muted); font-weight:700; font-size:16px}
.slots.right{border-style:solid; border-color:var(--ok); background:var(--ok-soft)}
.slots.wrong{border-style:solid; border-color:var(--bad); background:var(--bad-soft)}
.pool{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px}
.chip{border:2px solid var(--blue); background:var(--blue-soft); color:var(--ink); border-radius:12px; padding:10px 14px; font-weight:800; font-size:18px; min-height:48px}
.chip[disabled]{opacity:.3; cursor:default}
.slots .chip{background:var(--blue); color:var(--on-blue)}
.olist{display:grid; gap:10px; margin-bottom:16px}
.oitem{display:flex; align-items:center; gap:12px; width:100%; text-align:left; min-height:56px; padding:12px 14px; border:2px solid var(--line); border-radius:14px; background:var(--card); font-size:17px; font-weight:700; line-height:1.3}
.oitem .n{flex:0 0 32px; height:32px; border-radius:999px; border:2px dashed var(--line); display:flex; align-items:center; justify-content:center; font-weight:900}
.oitem.on{border-color:var(--blue)}
.oitem.on .n{border:0; background:var(--blue); color:var(--on-blue)}
.mrow{display:grid; gap:6px; padding:12px 14px; border:2px solid var(--line); border-radius:14px; background:var(--card); margin-bottom:10px}
.mrow .l{font-weight:900; font-size:19px}
.mrow select{width:100%; min-height:48px; padding:8px 10px; border:2px solid var(--line); border-radius:10px; background:var(--bg); font-size:17px; font-weight:700}
.mrow.right{border-color:var(--ok); background:var(--ok-soft)}
.mrow.wrong{border-color:var(--bad); background:var(--bad-soft)}
.mrow .fix{font-size:15px; font-weight:800; color:var(--bad)}
.row2{display:flex; gap:10px}
.btn{display:block; width:100%; min-height:54px; border:0; border-radius:14px; background:var(--blue); color:var(--on-blue); font-weight:900; font-size:18px; padding:12px 16px}
.btn[disabled]{opacity:.4; cursor:default}
.btn.ghost{background:transparent; color:var(--blue); border:2px solid var(--blue)}
.row2 .btn.ghost{flex:0 0 38%}

/* feedback */
.fb{margin-top:18px; border-radius:16px; padding:16px; border:2px solid; scroll-margin-bottom:24px}
.fb.ok{border-color:var(--ok); background:var(--ok-soft)}
.fb.bad{border-color:var(--bad); background:var(--bad-soft)}
.fb .t{display:flex; align-items:center; gap:8px; font-size:21px; font-weight:900; margin:0 0 6px}
.fb.ok .t{color:var(--ok)} .fb.bad .t{color:var(--bad)}
.fb p{margin:0 0 10px; font-size:17px; font-weight:600}
.fb .ans{font-weight:800}
.fb .dica{background:var(--card); border-radius:12px; padding:10px 12px; font-size:16px}
.fb .btn{margin-top:4px}

/* fim */
.score{font-size:64px; font-weight:900; line-height:1; margin:18px 0 6px; font-variant-numeric:tabular-nums}
.score small{font-size:28px; color:var(--muted)}
.msg{font-size:20px; font-weight:800; margin:0 0 20px}
.review h2{font-size:19px; font-weight:900; margin:24px 0 10px}
.ritem{background:var(--card); border:2px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:10px}
.ritem .rq{font-weight:800; margin:0 0 4px; font-size:17px}
.ritem .ra{margin:0; font-size:16px; color:var(--ok); font-weight:800}
.stack{display:grid; gap:10px; margin-top:18px}
footer{color:var(--muted); font-size:14px; font-weight:600; text-align:center; margin-top:30px}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important; scroll-behavior:auto !important}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function () {
"use strict";

/* ===================== PERGUNTAS =====================
   Tipos:
   mc     – escolha múltipla  {opts:[...], a: índice da certa}
   build  – montar com blocos {pool:[...], ans:[...]}
   order  – pôr por ordem      {items:[ordem certa]}
   match  – ligar pares        {pairs:[[esq, dir], ...]}
   Campos opcionais: block (texto/dados), table, pyr (pirâmide), dica
======================================================= */
var Q = [
/* ---------- CONCEITOS ---------- */
{t:"Conceitos", type:"mc",
 q:"O que é a natalidade (N)?",
 opts:["O número de nados-vivos num lugar, durante um ano","O número de nados-vivos por cada 1000 habitantes","O número médio de filhos por mulher","O número de pessoas que entram num país"],
 a:0,
 exp:"A natalidade é uma contagem: quantos bebés nasceram vivos. A opção “por cada 1000 habitantes” é a taxa de natalidade (TN), que é outra coisa.",
 dica:"Sem a palavra “Taxa” no nome, a resposta é uma contagem (em habitantes)."},

{t:"Conceitos", type:"match",
 q:"Liga cada sigla ao seu significado.",
 pairs:[["PA","Total de habitantes de um lugar"],["SM","Imigrantes menos emigrantes"],["CE","Crescimento natural + saldo migratório"],["ISF","Média de filhos por mulher"],["EMV","Anos que, em média, se espera viver"]],
 exp:"PA = população absoluta. SM = saldo migratório (I − E). CE = crescimento efetivo (CN + SM). ISF = índice sintético de fecundidade. EMV = esperança média de vida."},

{t:"Conceitos", type:"mc",
 q:"Imigração é…",
 opts:["A entrada de pessoas num país para lá viverem","A saída de pessoas do país para viverem no estrangeiro","O número de pessoas que nascem num ano","A diferença entre quem chega e quem parte"],
 a:0,
 exp:"Imigração (I) = entrar. Emigração (E) = sair. A diferença entre as duas é o saldo migratório (SM = I − E).",
 dica:"Imigrar = Ir para dentro. Emigrar = Exit (saída)."},

{t:"Conceitos", type:"mc",
 q:"Qual destes indicadores NÃO se exprime em permilagem (‰)?",
 opts:["Índice sintético de fecundidade (ISF)","Taxa de natalidade (TN)","Taxa de mortalidade infantil (TMI)","Taxa de crescimento efetivo (TCE)"],
 a:0,
 exp:"O ISF é o número médio de filhos por mulher (por exemplo 1,4). Não se multiplica por 1000. Todas as “taxas” vêm em ‰."},

{t:"Conceitos", type:"mc",
 q:"Qual é o índice de renovação das gerações?",
 opts:["2,1 filhos por mulher","2,0 filhos por mulher","1,0 filho por mulher","3,1 filhos por mulher"],
 a:0,
 exp:"São 2,1: 1 filho para substituir a mãe, 1 para substituir o pai e 0,1 para compensar as crianças que morrem antes de ter filhos.",
 dica:"Rasteira comum: responder 2,0 e esquecer o 0,1."},

{t:"Conceitos", type:"mc",
 q:"Porque é que, para comparar países, se usam taxas (por cada 1000 habitantes) e não números absolutos?",
 opts:["Porque os países têm populações de tamanhos muito diferentes","Porque as taxas são mais fáceis de calcular","Porque os números absolutos estão sempre errados","Porque as taxas dão sempre números maiores"],
 a:0,
 exp:"A Alemanha tem muitos mais bebés do que a Dinamarca só porque tem muito mais gente. Ao calcular “por cada 1000 habitantes”, ficam os dois na mesma escala e já se podem comparar."},

{t:"Conceitos", type:"mc",
 q:"O que é uma classe oca?",
 opts:["Uma classe etária com menos pessoas do que as classes vizinhas","Uma classe etária sem nenhuma pessoa","O grupo dos idosos com mais de 85 anos","A classe dos 0 aos 4 anos"],
 a:0,
 exp:"Na pirâmide aparece como uma “dentada”: uma barra mais curta do que a de cima e a de baixo. Pode ser causada por guerras, epidemias, emigração ou políticas como o filho único na China.",
 dica:"Rasteira: “oca” não quer dizer vazia, quer dizer com menos gente."},

/* ---------- FÓRMULAS ---------- */
{t:"Fórmulas", type:"build",
 q:"Monta a fórmula da taxa de natalidade (TN).",
 pool:["N","M","PA","÷","× 1000","× 100"],
 ans:["N","÷","PA","× 1000"],
 exp:"TN = N ÷ PA × 1000. É a “máquina” das taxas: o que aconteceu ÷ população absoluta × 1000.",
 dica:"Taxa = o que aconteceu ÷ quantas pessoas lá vivem × 1000."},

{t:"Fórmulas", type:"build",
 q:"Monta a fórmula da taxa de mortalidade infantil (TMI).",
 pool:["óbitos < 1 ano","óbitos","nados-vivos","PA","÷","× 1000"],
 ans:["óbitos < 1 ano","÷","nados-vivos","× 1000"],
 exp:"Na TMI divide-se pelos nados-vivos e não pela PA. Queremos saber: em cada 1000 bebés que nasceram, quantos morreram antes de fazer 1 ano?",
 dica:"A TMI é a exceção: em baixo estão os bebés, não a população toda."},

{t:"Fórmulas", type:"mc",
 q:"O crescimento efetivo (CE) calcula-se assim:",
 opts:["CE = CN + SM","CE = CN − SM","CE = N − M","CE = I − E"],
 a:0,
 exp:"O crescimento efetivo junta tudo: o crescimento natural (quem nasce − quem morre) mais o saldo migratório (quem chega − quem parte). N − M é o CN e I − E é o SM."},

{t:"Fórmulas", type:"mc",
 q:"Qual é o atalho para calcular a TCN?",
 opts:["TCN = TN − TM","TCN = TM − TN","TCN = TN + TM","TCN = TN ÷ TM"],
 a:0,
 exp:"Crescimento natural = nascimentos menos mortes. Por isso TCN = TN − TM. Se a TM for maior, a TCN dá negativa.",
 dica:"Primeiro quem nasce, depois quem morre: N antes de M."},

{t:"Fórmulas", type:"order",
 q:"Põe por ordem os passos para calcular a TCE.",
 items:["Calcular o CN (N − M)","Calcular o SM (I − E)","Somar CN + SM","Dividir pela PA","Multiplicar por 1000 e escrever ‰"],
 exp:"Primeiro as contas em habitantes (CN e SM), depois a soma (CE) e só no fim a “máquina” da taxa: ÷ PA × 1000."},

{t:"Fórmulas", type:"mc",
 q:"A taxa de crescimento efetivo (TCE) é igual a:",
 opts:["TCN + TCM","TCN − TCM","TN + TM","TN − TCM"],
 a:0,
 exp:"TCE = taxa de crescimento natural + taxa de crescimento migratório. É o mesmo raciocínio que CE = CN + SM, mas em ‰."},

/* ---------- CÁLCULOS ---------- */
{t:"Cálculos", type:"mc",
 q:"Calcula a taxa de natalidade de Portugal em 2021.",
 table:{head:["Portugal, 2021",""],rows:[["População absoluta","10 295 909"],["Nados-vivos","86 579"],["Óbitos","111 793"]]},
 opts:["≈ 8,4‰","≈ 0,0084","≈ 10,9‰","≈ 84,1‰"],
 a:0,
 exp:"TN = 86 579 ÷ 10 295 909 × 1000 ≈ 8,4‰. Se deu 0,0084, esqueceste o × 1000. Se deu 10,9‰, usaste os óbitos (isso é a TM).",
 dica:"Verifica com bom senso: a TN quase sempre dá entre 5‰ e 50‰."},

{t:"Cálculos", type:"mc",
 q:"Calcula a taxa de mortalidade infantil de Portugal em 2021.",
 table:{head:["Portugal, 2021",""],rows:[["População absoluta","10 295 909"],["Nados-vivos","86 579"],["Óbitos com menos de 1 ano","246"]]},
 opts:["≈ 2,8‰","≈ 0,02‰","≈ 28,4‰","≈ 2,8%"],
 a:0,
 exp:"TMI = 246 ÷ 86 579 × 1000 ≈ 2,8‰. Se deu 0,02‰, dividiste pela população absoluta, mas na TMI divide-se pelos nados-vivos.",
 dica:"Rasteira: a tabela tem a PA, mas na TMI não se usa."},

{t:"Cálculos", type:"mc",
 q:"Calcula o crescimento natural (CN) de Portugal em 2021.",
 table:{head:["Portugal, 2021",""],rows:[["Nados-vivos","86 579"],["Óbitos","111 793"]]},
 opts:["−25 214 habitantes","25 214 habitantes","198 372 habitantes","−2,4‰"],
 a:0,
 exp:"CN = N − M = 86 579 − 111 793 = −25 214 habitantes. É negativo porque morreram mais pessoas do que nasceram. −2,4‰ seria a TCN (a taxa), não o CN.",
 dica:"O CN é em habitantes e pode ser negativo: nunca apagues o sinal −."},

{t:"Cálculos", type:"mc",
 q:"Calcula a taxa de natalidade da Dinamarca em 2021.",
 table:{head:["Dinamarca, 2021",""],rows:[["População absoluta","5 822 763"],["Nados-vivos","61 167"],["Óbitos","53 958"]]},
 opts:["≈ 10,5‰","≈ 9,3‰","≈ 1,05‰","≈ 105‰"],
 a:0,
 exp:"TN = 61 167 ÷ 5 822 763 × 1000 ≈ 10,5‰. 9,3‰ é a taxa de mortalidade (usaste os óbitos)."},

{t:"Cálculos", type:"mc",
 q:"Calcula a taxa de natalidade da China em 2020.",
 table:{head:["China, 2020",""],rows:[["População absoluta","1 402 112 000"],["Nados-vivos","12 050 000"]]},
 opts:["≈ 8,6‰","≈ 86‰","≈ 0,86‰","≈ 8,6%"],
 a:0,
 exp:"TN = 12 050 000 ÷ 1 402 112 000 × 1000 ≈ 8,6‰. Com números tão grandes, conta os zeros com cuidado na calculadora."},

{t:"Cálculos", type:"mc",
 q:"Um país tem TCN = −2,4‰ e TCM = 4,3‰. Qual é a TCE?",
 opts:["1,9‰","6,7‰","−6,7‰","−1,9‰"],
 a:0,
 exp:"TCE = TCN + TCM = −2,4 + 4,3 = 1,9‰. É positiva: a população aumenta só por causa dos imigrantes. É o caso de Portugal em 2021."},

{t:"Cálculos", type:"mc",
 q:"Calcula a TMI da Alemanha em 2021.",
 table:{head:["Alemanha, 2021",""],rows:[["População absoluta","83 166 711"],["Nados-vivos","778 129"],["Óbitos com menos de 1 ano","2485"]]},
 opts:["≈ 3,2‰","≈ 0,03‰","≈ 31,9‰","≈ 3,2%"],
 a:0,
 exp:"TMI = 2485 ÷ 778 129 × 1000 ≈ 3,2‰. Se deu 0,03‰, dividiste pela PA em vez dos nados-vivos."},

{t:"Cálculos", type:"mc",
 q:"Um país tem TCN negativa, mas TCE positiva. O que quer dizer?",
 opts:["Morrem mais pessoas do que nascem, mas chegam mais imigrantes do que saem emigrantes","Nascem mais pessoas do que morrem","A população está a diminuir","Saem mais emigrantes do que chegam imigrantes"],
 a:0,
 exp:"TCN negativa = morrem mais do que nascem. Como a TCE é positiva, a população cresce na mesma, e isso só pode vir das migrações (saldo migratório positivo). É o que acontece na Alemanha e em Portugal.",
 dica:"TCE = TCN + TCM. Se a TCN é negativa e a TCE positiva, a TCM tem de ser positiva."},

/* ---------- PD e PED ---------- */
{t:"PD e PED", type:"mc",
 q:"Qual destas características é típica dos países em desenvolvimento (PED)?",
 opts:["Taxa de natalidade elevada","ISF abaixo de 2,1","Esperança média de vida de cerca de 81 anos","TMI de cerca de 4‰"],
 a:0,
 exp:"Nos PED a TN é cerca de 3 vezes maior do que nos PD. As outras três opções descrevem países desenvolvidos."},

{t:"PD e PED", type:"mc",
 q:"Qual destes fatores ajuda a explicar a baixa taxa de natalidade nos PD?",
 opts:["As mulheres participam mais no mercado de trabalho","Os filhos são vistos como fonte de rendimento","As pessoas casam muito cedo","Há pouco acesso a métodos contracetivos"],
 a:0,
 exp:"Nos PD as mulheres trabalham fora de casa, os filhos são caros e casa-se mais tarde, por isso nascem menos bebés. As outras opções explicam a TN alta dos PED."},

{t:"PD e PED", type:"mc",
 q:"Desde meados dos anos 2000, a taxa de mortalidade dos PD voltou a subir um pouco. Porquê?",
 opts:["Porque a população está envelhecida e há muitos idosos","Porque os cuidados de saúde pioraram","Porque aumentou a mortalidade infantil","Porque aumentou a natalidade"],
 a:0,
 exp:"Os idosos morrem mais do que os jovens. Como nos PD há cada vez mais idosos, morrem mais pessoas por cada 1000 habitantes, mesmo com ótimos cuidados de saúde.",

/* ===================== ESTADO ===================== */
var THEMES = ["Conceitos","Fórmulas","Cálculos","PD e PED","Evolução","Pirâmides","Mapas e gráficos"];
var LETTERS = ["A","B","C","D","E"];
var S = null;
var app = document.getElementById("app");
var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function shuffle(a){ var b=a.slice(); for(var i=b.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=b[i]; b[i]=b[j]; b[j]=t; } return b; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function store(k,v){ try{ if(v===undefined){ return localStorage.getItem(k); } localStorage.setItem(k,v); }catch(e){ return null; } }

function prepare(q){
  var inst = Object.assign({}, q);
  if(q.type==="mc"){ inst._right = q.opts[q.a]; inst._opts = q.opts.length===2 ? q.opts.slice() : shuffle(q.opts); }
  if(q.type==="build"){ inst._pool = shuffle(q.pool); }
  if(q.type==="order"){ inst._items = shuffle(q.items); }
  if(q.type==="match"){ inst._rights = shuffle(q.pairs.map(function(p){return p[1];})); }
  return inst;
}

function start(mode, theme){
  var list;
  if(mode==="quick"){ list = shuffle(Q).slice(0,15); }
  else if(mode==="theme"){ list = shuffle(Q.filter(function(q){return q.t===theme;})); }
  else if(mode==="retry"){ list = shuffle(S.wrong.map(function(w){return w.src;})); }
  else { list = shuffle(Q); }
  S = { mode:mode, theme:theme||null, queue:list.map(prepare), i:0, right:0, wrong:[], answered:false, pick:[] };
  renderQ();
}

/* ===================== ECRÃ INICIAL ===================== */
function renderStart(){
  var bq = store("geo8-best-quick"), bf = store("geo8-best-full");
  var best = [];
  if(bq){ best.push("Treino rápido: " + bq); }
  if(bf){ best.push("Teste completo: " + bf); }
  app.innerHTML =
    '<section class="hero">' +
      '<div class="kicker">Geografia, 8.º ano</div>' +
      '<h1>População: treino para o teste</h1>' +
      '<p>Indicadores, fórmulas, PD e PED, evolução da população e pirâmides etárias.</p>' +
    '</section>' +
    '<div class="modes">' +
      '<button class="mode main" data-mode="quick"><b>Treino rápido</b><span>15 perguntas à sorte</span></button>' +
      '<button class="mode" data-mode="full"><b>Teste completo</b><span>Todas as ' + Q.length + ' perguntas, por ordem aleatória</span></button>' +
    '</div>' +
    '<div class="themes"><h2>Ou treina só um tema</h2><div class="chips">' +
      THEMES.map(function(t){ var n=Q.filter(function(q){return q.t===t;}).length; return '<button class="tchip" data-theme="'+esc(t)+'">'+esc(t)+' ('+n+')</button>'; }).join("") +
    '</div></div>' +
    '<p class="note">Tem a calculadora à mão: há perguntas de contas. Quando errares, lê a explicação antes de continuar.</p>' +
    (best.length ? '<p class="best">Melhor resultado: ' + esc(best.join(" · ")) + '</p>' : '') +
    '<footer>Feito a partir do manual e da matriz da ficha de avaliação.</footer>';
  app.querySelectorAll("[data-mode]").forEach(function(b){ b.addEventListener("click", function(){ start(b.getAttribute("data-mode")); }); });
  app.querySelectorAll("[data-theme]").forEach(function(b){ b.addEventListener("click", function(){ start("theme", b.getAttribute("data-theme")); }); });
  window.scrollTo(0,0);
}

/* ===================== PERGUNTA ===================== */
function planeSVG(){
  return '<svg class="plane" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M2.5 19.5 22 12 2.5 4.5v5.8L15 12 2.5 13.7z"/></svg>';
}
function barHTML(){
  var n = S.queue.length, done = S.i, pct = n ? (done / n) * 100 : 0;
  return '<div class="bar">' +
    '<div class="bar-row"><button class="quit" id="quit">Sair</button>' +
    '<span>Pergunta <strong>' + (S.i+1) + '</strong> de ' + n + '</span>' +
    '<span>Certas: <strong>' + S.right + '</strong></span></div>' +
    '<div class="route" role="progressbar" aria-valuemin="0" aria-valuemax="'+n+'" aria-valuenow="'+done+'" aria-label="Progresso">' +
      '<div class="done" style="width:' + pct + '%"></div>' +
      '<div style="position:absolute; left:' + pct + '%; top:0">' + planeSVG() + '</div>' +
    '</div></div>';
}
function pyrSVG(p){
  var n = p.w.length, h = 11, g = 3, H = n*(h+g), W = 240, c = W/2, k = 1.15;
  var r = "";
  p.w.forEach(function(w,i){
    var y = i*(h+g), wl = w*k, wr = (i<4 ? w*1.12 : w)*k;
    var stroke = (p.hl===i) ? ';stroke:var(--orange);stroke-width:3' : '';
    r += '<rect x="'+(c-2-wl)+'" y="'+y+'" width="'+wl+'" height="'+h+'" rx="1.5" style="fill:var(--men)'+stroke+'"/>';
    r += '<rect x="'+(c+2)+'" y="'+y+'" width="'+wr+'" height="'+h+'" rx="1.5" style="fill:var(--women)'+stroke+'"/>';
  });
  return '<div class="pyr"><div class="pyr-legend"><span class="m">Homens</span><span class="f">Mulheres</span></div>' +
    '<svg viewBox="-4 -4 '+(W+8)+' '+(H+8)+'" role="img" aria-label="Pirâmide etária">' + r + '</svg>' +
    '<small>Em cima os mais velhos, em baixo os mais novos</small></div>';
}
function tableHTML(t){
  return '<div class="block tablewrap"><table class="data"><thead><tr>' + t.head.map(function(h){return '<th>'+esc(h)+'</th>';}).join("") + '</tr></thead><tbody>' +
    t.rows.map(function(r){ return '<tr>' + r.map(function(c){return '<td>'+esc(c)+'</td>';}).join("") + '</tr>'; }).join("") + '</tbody></table></div>';
}

function renderQ(){
  var q = S.queue[S.i];
  S.answered = false; S.pick = [];
  var html = barHTML() + '<section aria-live="polite">' +
    '<span class="tag">' + esc(q.t) + '</span>' +
    '<h2 class="q" id="qtext">' + esc(q.q) + '</h2>';
  if(q.block){ html += '<div class="block">' + q.block + '</div>'; }
  if(q.table){ html += tableHTML(q.table); }
  if(q.pyr){ html += pyrSVG(q.pyr); }
  html += '<div id="body"></div><div id="fb"></div></section>';
  app.innerHTML = html;
  document.getElementById("quit").addEventListener("click", function(){ if(confirm("Sair do quiz? Perdes o progresso desta ronda.")){ renderStart(); } });
  var body = document.getElementById("body");
  if(q.type==="mc"){ renderMC(q, body); }
  if(q.type==="build"){ renderBuild(q, body); }
  if(q.type==="order"){ renderOrder(q, body); }
  if(q.type==="match"){ renderMatch(q, body); }
  window.scrollTo(0,0);
}

/* escolha múltipla */
function renderMC(q, body){
  body.innerHTML = '<div class="opts">' + q._opts.map(function(o,i){
    return '<button class="opt" data-i="'+i+'"><span class="k">'+LETTERS[i]+'</span><span>'+esc(o)+'</span></button>';
  }).join("") + '</div>';
  body.querySelectorAll(".opt").forEach(function(b){
    b.addEventListener("click", function(){
      if(S.answered){ return; }
      var chosen = q._opts[+b.getAttribute("data-i")];
      var ok = chosen === q._right;
      body.querySelectorAll(".opt").forEach(function(x){
        var t = q._opts[+x.getAttribute("data-i")];
        x.disabled = true;
        if(t===q._right){ x.classList.add("right"); x.querySelector(".k").textContent = "✓"; }
        else if(x===b){ x.classList.add("wrong"); x.querySelector(".k").textContent = "✗"; }
      });
      finish(ok, q._right);
    });
  });
}

/* montar com blocos */
function renderBuild(q, body){
  function draw(){
    var used = S.pick;
    body.innerHTML =
      '<p class="hint">Toca nos blocos pela ordem certa. Toca num bloco lá em cima para o tirar.</p>' +
      '<div class="slots" id="slots">' + (used.length ? used.map(function(pi,k){ return '<button class="chip" data-k="'+k+'">'+esc(q._pool[pi])+'</button>'; }).join("") : '<span class="empty">A tua resposta aparece aqui</span>') + '</div>' +
      '<div class="pool">' + q._pool.map(function(p,i){ var dis = used.indexOf(i)>-1; return '<button class="chip" data-i="'+i+'"'+(dis?' disabled':'')+'>'+esc(p)+'</button>'; }).join("") + '</div>' +
      '<div class="row2"><button class="btn ghost" id="clr">Limpar</button><button class="btn" id="chk"'+(used.length===q.ans.length?'':' disabled')+'>Verificar</button></div>';
    if(S.answered){ return; }
    body.querySelectorAll(".pool .chip").forEach(function(b){ b.addEventListener("click", function(){ if(S.pick.length < q.ans.length){ S.pick.push(+b.getAttribute("data-i")); draw(); } }); });
    body.querySelectorAll("#slots .chip").forEach(function(b){ b.addEventListener("click", function(){ S.pick.splice(+b.getAttribute("data-k"),1); draw(); }); });
    document.getElementById("clr").addEventListener("click", function(){ S.pick=[]; draw(); });
    document.getElementById("chk").addEventListener("click", function(){
      var got = S.pick.map(function(i){return q._pool[i];});
      var ok = got.join("|") === q.ans.join("|");
      S.answered = true;
      draw();
      body.querySelectorAll("button").forEach(function(x){ x.disabled = true; });
      document.getElementById("slots").classList.add(ok ? "right" : "wrong");
      finish(ok, q.ans.join("  "));
    });
  }
  draw();
}

/* pôr por ordem */
function renderOrder(q, body){
  function draw(){
    body.innerHTML =
      '<p class="hint">Toca nos blocos pela ordem certa: o primeiro que tocares fica com o número 1. Toca outra vez no último para o desmarcar.</p>' +
      '<div class="olist">' + q._items.map(function(it,i){
        var pos = S.pick.indexOf(i);
        return '<button class="oitem'+(pos>-1?' on':'')+'" data-i="'+i+'"><span class="n">'+(pos>-1?pos+1:'')+'</span><span>'+esc(it)+'</span></button>';
      }).join("") + '</div>' +
      '<div class="row2"><button class="btn ghost" id="clr">Limpar</button><button class="btn" id="chk"'+(S.pick.length===q.items.length?'':' disabled')+'>Verificar</button></div>';
    if(S.answered){ return; }
    body.querySelectorAll(".oitem").forEach(function(b){
      b.addEventListener("click", function(){
        var i = +b.getAttribute("data-i"), pos = S.pick.indexOf(i);
        if(pos === -1){ S.pick.push(i); }
        else if(pos === S.pick.length-1){ S.pick.pop(); }
        draw();
      });
    });
    document.getElementById("clr").addEventListener("click", function(){ S.pick=[]; draw(); });
    document.getElementById("chk").addEventListener("click", function(){
      var got = S.pick.map(function(i){return q._items[i];});
      var ok = got.join("|") === q.items.join("|");
      S.answered = true;
      draw();
      body.querySelectorAll("button").forEach(function(x){ x.disabled = true; });
      body.querySelectorAll(".oitem").forEach(function(x){
        var it = q._items[+x.getAttribute("data-i")];
        var mine = S.pick.indexOf(+x.getAttribute("data-i"));
        x.style.borderColor = (q.items.indexOf(it) === mine) ? "var(--ok)" : "var(--bad)";
      });
      finish(ok, q.items.map(function(it,k){ return (k+1)+". "+it; }).join("<br>"), true);
    });
  }
  draw();
}

/* ligar pares */
function renderMatch(q, body){
  body.innerHTML = '<p class="hint">Escolhe a resposta certa para cada um.</p>' +
    q.pairs.map(function(p,i){
      return '<div class="mrow" data-i="'+i+'"><span class="l">'+esc(p[0])+'</span>' +
        '<select aria-label="Resposta para '+esc(p[0])+'"><option value="">Escolher…</option>' +
        q._rights.map(function(r){ return '<option value="'+esc(r)+'">'+esc(r)+'</option>'; }).join("") +
        '</select></div>';
    }).join("") +
    '<button class="btn" id="chk" disabled>Verificar</button>';
  var sels = body.querySelectorAll("select");
  function upd(){ var all = true; sels.forEach(function(s){ if(!s.value){ all=false; } }); document.getElementById("chk").disabled = !all; }
  sels.forEach(function(s){ s.addEventListener("change", upd); });
  document.getElementById("chk").addEventListener("click", function(){
    if(S.answered){ return; }
    S.answered = true;
    var ok = true;
    body.querySelectorAll(".mrow").forEach(function(row){
      var i = +row.getAttribute("data-i"), s = row.querySelector("select");
      var good = s.value === q.pairs[i][1];
      if(!good){ ok = false; row.insertAdjacentHTML("beforeend", '<span class="fix">Certo: '+esc(q.pairs[i][1])+'</span>'); }
      row.classList.add(good ? "right" : "wrong");
      s.disabled = true;
    });
    document.getElementById("chk").disabled = true;
    finish(ok, null);
  });
}

/* feedback */
function finish(ok, rightText, rightIsHTML){
  var q = S.queue[S.i];
  if(ok){ S.right++; } else { S.wrong.push({src: Q[Q.indexOf(findSrc(q))], q: q}); }
  var last = S.i === S.queue.length-1;
  var fb = document.getElementById("fb");
  fb.innerHTML =
    '<div class="fb '+(ok?'ok':'bad')+'" tabindex="-1" id="fbbox">' +
      '<p class="t">'+(ok ? '✓ Certo!' : '✗ Ainda não')+'</p>' +
      (!ok && rightText ? '<p class="ans">Resposta certa: '+(rightIsHTML ? '<br>'+escKeepBr(rightText) : esc(rightText))+'</p>' : '') +
      '<p>'+esc(q.exp)+'</p>' +
      (q.dica ? '<p class="dica"><strong>Truque:</strong> '+esc(q.dica)+'</p>' : '') +
      '<button class="btn" id="next">'+(last ? 'Ver resultado' : 'Continuar')+'</button>' +
    '</div>';
  document.getElementById("next").addEventListener("click", function(){
    if(last){ renderEnd(); } else { S.i++; renderQ(); }
  });
  var box = document.getElementById("fbbox");
  box.scrollIntoView({behavior: reduceMotion ? "auto" : "smooth", block:"nearest"});
  box.focus({preventScroll:true});
  var spans = app.querySelectorAll(".bar-row strong");
  if(spans.length>1){ spans[1].textContent = S.right; }
}
function escKeepBr(s){ return s.split("<br>").map(esc).join("<br>"); }
function findSrc(inst){ for(var i=0;i<Q.length;i++){ if(Q[i].q===inst.q && Q[i].t===inst.t){ return Q[i]; } } return inst; }

/* ===================== RESULTADO ===================== */
function renderEnd(){
  var n = S.queue.length, r = S.right, pct = n ? Math.round(r/n*100) : 0;
  var msg = pct>=90 ? "Pronto para o teste!" : pct>=70 ? "Quase lá. Revê as que falhaste." : pct>=50 ? "Bom começo. Treina outra vez as erradas." : "Volta às fichas e tenta de novo, vais ver que melhora.";
  if(S.mode==="quick" || S.mode==="full"){
    var key = "geo8-best-" + S.mode, prev = store(key), prevPct = prev ? parseInt(prev,10) : -1;
    if(pct > prevPct){ store(key, pct + "%"); }
  }
  var wrongHTML = "";
  if(S.wrong.length){
    wrongHTML = '<div class="review"><h2>Para rever</h2>' + S.wrong.map(function(w){
      var q = w.q, ans;
      if(q.type==="mc"){ ans = q._right; }
      else if(q.type==="build"){ ans = q.ans.join("  "); }
      else if(q.type==="order"){ ans = q.items.join(" → "); }
      else { ans = q.pairs.map(function(p){return p[0]+": "+p[1];}).join(" | "); }
      return '<div class="ritem"><p class="rq">'+esc(q.q)+'</p><p class="ra">'+esc(ans)+'</p></div>';
    }).join("") + '</div>';
  }
  app.innerHTML =
    '<section class="hero" aria-live="polite">' +
      '<div class="kicker">Resultado</div>' +
      '<p class="score">'+r+'<small> / '+n+'</small></p>' +
      '<p class="msg">'+esc(msg)+'</p>' +
    '</section>' +
    '<div class="stack">' +
      (S.wrong.length ? '<button class="btn" id="retry">Treinar só as '+S.wrong.length+' erradas</button>' : '') +
      '<button class="btn'+(S.wrong.length?' ghost':'')+'" id="again">Nova ronda</button>' +
      '<button class="btn ghost" id="home">Voltar ao início</button>' +
    '</div>' + wrongHTML;
  if(S.wrong.length){ document.getElementById("retry").addEventListener("click", function(){ start("retry"); }); }
  document.getElementById("again").addEventListener("click", function(){ if(S.mode==="theme"){ start("theme", S.theme); } else if(S.mode==="retry"){ start("quick"); } else { start(S.mode); } });
  document.getElementById("home").addEventListener("click", renderStart);
  window.scrollTo(0,0);
}

renderStart();
})();
</script>
</body>
</html>
